name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history — needed for tag/reproduce tests later

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: gofmt check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "gofmt required on:"; gofmt -l .; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -race -v

      - name: build
        run: go build -o /tmp/simtrack ./cmd/simtrack

      - name: shellcheck the Phase 0 wrapper (if still present)
        if: hashFiles('bin/simtrack-run') != ''
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck bin/simtrack-run

      - name: end-to-end smoke test
        run: |
          # create a throwaway git repo, run the CLI, assert the manifest exists
          TMP=$(mktemp -d)
          cd "$TMP"
          git init -q && git config user.email t@t && git config user.name t
          echo hi > README.md && git add . && git commit -qm init
          /tmp/simtrack init demo
          cd demo && git add . && git commit -qm "init demo"
          /tmp/simtrack run -- echo hello
          RUN_DIR=$(ls -td runs/run-* | head -1)
          test -f "$RUN_DIR/manifest.json"
          python3 -c "import json,sys; m=json.load(open(sys.argv[1])); \
            assert m['status']=='completed', m; \
            assert m['exit_code']==0, m; \
            assert m['git_dirty'] is False, m" "$RUN_DIR/manifest.json"
