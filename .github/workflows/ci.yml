name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history — needed for tag/reproduce tests later

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: gofmt check
        run: |
          cd cmd/simtrack
          if [ -n "$(gofmt -l .)" ]; then
            echo "gofmt required on:"; gofmt -l .; exit 1
          fi

      - name: go vet
        run:  go vet ./...

      - name: go test
        run: go test ./... -race -v

      - name: build
        run: go build -o /tmp/simtrack .

